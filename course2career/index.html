<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course2Career</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#10B981', // Emerald 500
              'primary-focus': '#059669', // Emerald 600
              'primary-content': '#FFFFFF',
              secondary: '#1E293B', // Slate 800
              'secondary-focus': '#334155', // Slate 700
              'secondary-content': '#F1F5F9', // Slate 100 (Brighter for headings)
              'base-100': '#0F172A', // Slate 900
              'base-content': '#E2E8F0', // Slate 200 (Brighter for body text)
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
               'pulse-slow': {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.5' },
                '50%': { transform: 'scale(1.05)', opacity: '0.7' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'pulse-slow': 'pulse-slow 10s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          },
        },
      }
    </script>
  <script type="importmap">

    "react/": "https://aistudiocdn.com/react@^19.1.1/",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

  </body>
